name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The app ships on macOS first, so macOS is the job that builds everything
  # and runs every gate. Same steps as Flow's CI, in the same order.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # rust-toolchain.toml pins the version; this installs the
          # components it asks for.
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          # Named so the release workflow can read the cache main writes.
          shared-key: build-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      # --all-targets so a test target that stops compiling fails CI rather
      # than going unnoticed, which is how Flow lost tests/chord_live.rs for
      # six commits.
      - name: Build tests
        run: cargo test --workspace --all-targets --no-run

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Warm the release cache
        if: github.ref == 'refs/heads/main'
        run: cargo build --release

      # The bundle metadata and the scripts are product surface that nothing
      # else compiles.
      - name: Packaging
        run: |
          plutil -lint packaging/macos/*.plist
          bash -n packaging/install.sh
          bash -n packaging/uninstall.sh

  # The engine is shared with the Linux surface to come. Testing it on Linux
  # now keeps a macOS-only assumption from creeping into gramly-core.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build tests
        run: cargo test --workspace --all-targets --no-run

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

# Tag-driven, as in Flow: push vX.Y.Z and this builds, tests and drafts a
# release. Publishing the draft is a decision for whoever ran the build.

name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-macos
          save-if: false

      # The app and the engine are versioned together and ship as one
      # binary; a release whose manifests disagree reports a version nobody
      # built.
      - name: Version matches the tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          found=$(.toolkit/version)
          if [ "$found" != "$expected" ]; then
            echo "manifests say $found, tag is $expected" >&2
            exit 1
          fi

      - name: Channel matches the tag
        run: |
          channel=$(cat packaging/channel)
          case "$GITHUB_REF_NAME:$channel" in
            v*-experimental.*:experimental) ;;
            v*-*:*) exit 1 ;;
            v*:stable) ;;
            *) exit 1 ;;
          esac

      # A tag can point at a commit CI never saw. Building an untested binary
      # is cheap; shipping one is not.
      - name: Test
        run: cargo test --release --workspace

      - name: Build
        run: scripts/build

      # The only step given the key, and it compiles nothing: a dependency's
      # build script could read a key that was there during the build.
      - name: Sign
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
          UPDATER_SIGNING_KEY_PASSWORD: ${{ secrets.UPDATER_SIGNING_KEY_PASSWORD }}
        run: scripts/build --sign

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-macos
          path: dist/
          if-no-files-found: error

  # In Arch, as in CI: the platform the Linux surface is built and measured
  # on, and the one with gtk4-layer-shell as a package.
  linux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: System packages
        run: pacman -Syu --noconfirm --needed base-devel git gtk4 gtk4-layer-shell rustup

      - uses: actions/checkout@v4

      - name: Rust
        run: rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-linux
          save-if: false

      - name: Test
        run: cargo test --release --workspace

      - name: Build
        run: scripts/build

      # The only step given the key, and it compiles nothing: a dependency's
      # build script could read a key that was there during the build.
      - name: Sign
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
          UPDATER_SIGNING_KEY_PASSWORD: ${{ secrets.UPDATER_SIGNING_KEY_PASSWORD }}
        run: scripts/build --sign

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-linux
          path: dist/
          if-no-files-found: error

  # One draft holding every platform's bundle and signature and the feed
  # that names them. Publishing it is what offers the update to installed
  # copies: they read the latest published release's latest.json.
  draft:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bundle-*
          merge-multiple: true

      - name: Feed
        run: scripts/build --feed

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          # `gh release create` on a tag that already has a release makes a
          # second, untagged draft instead of failing. Flow has the orphan to
          # prove it. Refuse instead.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a release - delete it, or tag a new version" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            $prerelease \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*

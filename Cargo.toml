[workspace]
# Declared explicitly: path dependencies are not members by default, and
# `cargo test --workspace` would build gramly-core and run none of its tests.
members = [".", "crates/core"]

[package]
name = "gramly"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Grammar suggestions in whatever text field has focus"

[dependencies]
anyhow = "1"
gramly-core = { path = "crates/core" }
libc = "0.2"
serde_json = "1"

[profile.dev]
debug = 1

# Harper's curated dictionary is built on first use; at opt-level 0 that is
# seconds rather than milliseconds, and it happens on every launch.
[profile.dev.package."*"]
opt-level = 3

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-application-services = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
# The card's font is bundled in the binary and loaded from its bytes.
objc2-core-text = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
# `gramly lab` only: a web text box to audit fixes against, and the
# completion block its JavaScript answers through.
objc2-web-kit = "0.3.2"
block2 = "0.6.2"

[target.'cfg(target_os = "linux")'.dependencies]
atspi-proxies = "0.14"
zbus = "5"
gtk4 = "0.11"
gtk4-layer-shell = "0.8"
wl-clipboard-rs = "0.9"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

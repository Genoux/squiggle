[workspace]
# Declared explicitly: path dependencies are not members by default, and
# `cargo test --workspace` would build gramly-core and run none of its tests.
members = [".", "crates/core"]

[package]
name = "gramly"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Grammar suggestions in whatever text field has focus"

[dependencies]
anyhow = "1"
gramly-core = { path = "crates/core" }

[profile.dev]
debug = 1

# Harper's curated dictionary is built on first use; at opt-level 0 that is
# seconds rather than milliseconds, and it happens on every launch.
[profile.dev.package."*"]
opt-level = 3

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-application-services = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
